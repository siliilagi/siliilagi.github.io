<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="header"></div>

    <main>
        <section class="contact">
            <h2 class="sectionTitle">Get in Touch</h2>

            <div class="contact-grid">
                <!-- LEFT: Contact Form -->
                <form class="contact-form">
                    <label>Name</label>
                    <input type="text" placeholder="Your name" />

                    <label>Email</label>
                    <input type="text" placeholder="Your email" />

                    <label>Message</label>
                    <textarea rows="5" placeholder="Your message"></textarea>

                    <button type="submit">Send Message</button>
                </form>

                <!-- RIGHT: Contact Info -->
                <div class="contact-info">
                    <h3>Contact Info</h3>
                    <p>Email: <a href="siliilagim@gmail.com">siliilagim@gmail.com</a></p>
                    <p>Location: American Fork, UT</p>
                    <p>LinkedIn: <a
                            href="http://www.linkedin.com/in/marley-williams">linkedin.com/in/marley-williams</a></p>
                </div>
            </div>
        </section>


    </main>

    <div id="footer"></div>
    <script src="main.js"></script>

</body>

</html>

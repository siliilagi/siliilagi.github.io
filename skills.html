<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lagi Williams | Skills</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="header"></div>
    <main>
        <section class="skills">
            <img src="tribal3.png" alt="" class="page-tribal" aria-hidden="true">
            <h2 class="sectionTitle">Skills</h2>

            <!-- Featured: Data & Analytics -->
            <div class="skills-featured">
                <p class="skills-label">Data & Analytics</p>
                <div class="skills-pills">
                    <span class="pill pill-featured">SQL</span>
                    <span class="pill pill-featured">Python</span>
                    <span class="pill pill-featured">Tableau</span>
                    <span class="pill pill-featured">Google Sheets</span>
                </div>
            </div>

            <!-- Other skill groups -->
            <div class="skills-groups">

                <div class="skills-group">
                    <p class="skills-label">Web & Languages</p>
                    <div class="skills-pills">
                        <span class="pill">HTML</span>
                        <span class="pill">CSS</span>
                        <span class="pill">JavaScript</span>
                        <span class="pill">Java</span>
                        <span class="pill">C++</span>
                    </div>
                </div>

                <div class="skills-group">
                    <p class="skills-label">Tools & Platforms</p>
                    <div class="skills-pills">
                        <span class="pill">Git</span>
                        <span class="pill">Deepnote</span>
                        <span class="pill">QuickBooks</span>
                        <span class="pill">WordPress</span>
                        <span class="pill">Canva</span>
                        <span class="pill">Adobe Suite</span>
                        <span class="pill">Mailchimp</span>
                        <span class="pill">Claude</span>
                        <span class="pill">ChatGPT</span>
                    </div>
                </div>

                <div class="skills-group">
                    <p class="skills-label">Soft Skills</p>
                    <div class="skills-pills">
                        <span class="pill">Communication</span>
                        <span class="pill">Adaptability</span>
                        <span class="pill">Problem Solving</span>
                        <span class="pill">Collaboration</span>
                        <span class="pill">Time Management</span>
                    </div>
                </div>

            </div>
        </section>
    </main>
    <div id="footer"></div>
    <script src="main.js"></script>
</body>

</html>

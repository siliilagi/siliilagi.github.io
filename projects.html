<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="projects-page">
    <div id="header"></div>

    <header>
        <h1>Projects</h1>
    </header>

    <main class="projects-page">
    
        <!-- Filter buttons — you'll wire these up in Task 5 -->
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="HTML">HTML</button>
            <button class="filter-btn" data-filter="CSS">CSS</button>
            <button class="filter-btn" data-filter="JavaScript">JavaScript</button>
            <button class="filter-btn" data-filter="React 18">React 18</button>
            <button class="filter-btn" data-filter="Firebase">Firebase</button>
            <button class="filter-btn" data-filter="Content Creation">Content Creation</button>
            <button class="filter-btn" data-filter="Health & Fitness">Health & Fitness</button>
        </div>
    
        <!-- Cards get injected here by JavaScript -->
        <div class="projects-grid" id="projectsGrid"></div>
        
        <section class="instagram-section">
            <h2 class="sectionTitle">Health & Fitness Content</h2>
            <a href="https://www.instagram.com/_kaua.oliko.ikalani_" class="instagram-link" target="_blank">
                Follow on Instagram ↗
            </a>
            <div class="instagram-grid">
                <div class="instagram-video-wrapper">
                    <video class="instagram-video" src="fitness1.MP4" loop muted playsinline></video>
                </div>
                <div class="instagram-video-wrapper">
                    <video class="instagram-video" src="fitness2.MP4" loop muted playsinline></video>
                </div>
                <div class="instagram-video-wrapper">
                    <video class="instagram-video" src="fitness3.MP4" loop muted playsinline></video>
                </div>
            </div>
            </section>
    </main>
    
    <!-- Modal — lives outside main, hidden by default -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <button class="modal-close" id="modalClose">✕</button>
            <div class="modal-tags" id="modalTags"></div>
            <h2 class="modal-title" id="modalTitle"></h2>
            <p class="modal-status" id="modalStatus"></p>
            <p class="modal-detail" id="modalDetail"></p>
        </div>
    </div>

    <div id="footer"></div>
    <script src="main.js"></script>
    <!-- <script src="instagram-scroll.js"></script> -->
</body>

</html>

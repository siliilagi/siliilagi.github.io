<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lagi Williams | Projects</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="projects-page">
    <div id="header"></div>

    <header>
        <h1>Projects</h1>
    </header>

    <main class="projects-page">
    
        <!-- Filter buttons — data-filter must match a project's tags -->
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="Data Analysis">Data Analysis</button>
            <button class="filter-btn" data-filter="SQL">SQL</button>
            <button class="filter-btn" data-filter="Tableau">Tableau</button>
            <button class="filter-btn" data-filter="Looker">Looker</button>
            <button class="filter-btn" data-filter="Google Sheets">Google Sheets</button>
        </div>
    
        <!-- Cards get injected here by JavaScript -->
        <div class="projects-grid" id="projectsGrid"></div>

    </main>
    
    <!-- Modal — lives outside main, hidden by default -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <button class="modal-close" id="modalClose">✕</button>
            <div class="modal-tags" id="modalTags"></div>
            <h2 class="modal-title" id="modalTitle"></h2>
            <p class="modal-status" id="modalStatus"></p>
            <img class="modal-image" id="modalImage" alt="" style="display: none;">
            <div class="modal-detail" id="modalDetail"></div>
            <a class="tl-site-link" id="modalLink" target="_blank" rel="noopener" style="display: none;">
                <span class="tl-site-label">View</span>
                <span class="tl-site-url" id="modalLinkText"></span>
            </a>
        </div>
    </div>

    <div id="footer"></div>
    <script src="main.js"></script>
    <!-- <script src="instagram-scroll.js"></script> -->
</body>

</html>
